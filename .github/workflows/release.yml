name: Release

# 打 v* 标签时构建全端产物并创建 GitHub Release；
# workflow_dispatch 手动触发只上传 workflow artifacts，用于试跑。
# 版本号用于归档命名、Release 标题和构建版本注入，不回写任何构建文件。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（SemVer；缺省短 commit 会映射为 0.0.0-commit.* 构建版本）"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prep:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_version: ${{ steps.version.outputs.build_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="$(git rev-parse --short HEAD)"
          fi
          semver='^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ "$version" =~ $semver ]]; then
            normalized="${version#v}"
            [ "${#normalized}" -le 32 ] || { echo "Release version exceeds 32 characters" >&2; exit 1; }
            core="${normalized%%[-+]*}"
            IFS='.' read -r major minor patch <<< "$core"
            for component in "$major" "$minor" "$patch"; do
              if [ "${#component}" -gt 10 ] || { [ "${#component}" -eq 10 ] && [[ "$component" > "2147483647" ]]; }; then
                echo "SemVer core components must fit a signed 32-bit integer" >&2
                exit 1
              fi
            done
            core_and_pre="${normalized%%+*}"
            if [[ "$core_and_pre" == *-* ]]; then
              prerelease="${core_and_pre#*-}"
              IFS='.' read -ra identifiers <<< "$prerelease"
              for identifier in "${identifiers[@]}"; do
                if [[ "$identifier" =~ ^[0-9]+$ && "$identifier" == 0[0-9]* ]]; then
                  echo "Numeric prerelease identifiers must not contain leading zeroes" >&2
                  exit 1
                fi
              done
            fi
            build_version="$normalized"
          elif ! [[ "$version" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "Invalid release version: use SemVer (optionally prefixed with v)" >&2
            exit 1
          else
            build_version="0.0.0-commit.${version:0:12}"
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'build_version=%s\n' "$build_version" >> "$GITHUB_OUTPUT"

  go-server:
    name: Go server (linux-${{ matrix.arch }})
    needs: prep
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      RELEASE_VERSION: ${{ needs.prep.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: implementations/go/server/go.mod
          cache-dependency-path: implementations/go/server/go.sum

      - name: Build admin web into Go server static assets
        run: |
          npm --prefix apps/admin-web ci
          npm --prefix apps/admin-web test
          npm --prefix apps/admin-web run deploy:go

      - name: Test Go server
        working-directory: implementations/go/server
        run: go test ./... -count=1

      - name: Cross-compile Go server
        working-directory: implementations/go/server
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: go build -trimpath -ldflags "-s -w" -o specus-server ./cmd/specus-server

      - name: Package archive
        working-directory: implementations/go/server
        run: |
          set -euo pipefail
          pkg="specus-server-linux-${{ matrix.arch }}"
          stage="out/$pkg"
          rm -rf "$stage" "out/$pkg.tar.gz"
          mkdir -p "$stage"
          cp specus-server "$stage/"
          cp -r "$GITHUB_WORKSPACE/deploy/go-server/systemd" "$stage/systemd"

          commit="$(git rev-parse HEAD)"
          dirty=false
          [ -n "$(git status --porcelain)" ] && dirty=true
          hash="$(sha256sum specus-server | cut -d' ' -f1)"
          size="$(stat -c%s specus-server)"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go_version="$(go version)"

          cat > "$stage/manifest.json" <<EOF
          {
            "name": "specus-server",
            "target": "linux/${{ matrix.arch }}",
            "commit": "$commit",
            "dirty": $dirty,
            "builtAtUtc": "$built_at",
            "goVersion": "$go_version",
            "cgoEnabled": false,
            "binary": "specus-server",
            "sizeBytes": $size,
            "sha256": "$hash",
            "healthPath": "/health",
            "systemdUnit": "specus-server-go.service"
          }
          EOF
          printf '%s  %s\n' "$hash" "specus-server" > "$stage/SHA256SUMS"

          tar -czf "out/$pkg.tar.gz" -C "$stage" .
          (cd out && sha256sum "$pkg.tar.gz" > "$pkg.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: specus-server-linux-${{ matrix.arch }}
          path: |
            implementations/go/server/out/specus-server-linux-${{ matrix.arch }}.tar.gz
            implementations/go/server/out/specus-server-linux-${{ matrix.arch }}.tar.gz.sha256

  go-client:
    name: Go client (6 platforms)
    needs: prep
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.prep.outputs.version }}
      BUILD_VERSION: ${{ needs.prep.outputs.build_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: implementations/go/client/go.mod
          cache-dependency-path: implementations/go/client/go.sum

      - name: Test Go client
        working-directory: implementations/go/client
        run: go test ./... -count=1

      - name: Package Go client
        run: bash implementations/go/client/scripts/package-release.sh "$RELEASE_VERSION" "$BUILD_VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: specus-client-go
          path: implementations/go/client/out/release/${{ env.RELEASE_VERSION }}/*

  java:
    name: Java server / client / STUN
    needs: prep
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.prep.outputs.version }}
      BUILD_VERSION: ${{ needs.prep.outputs.build_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json

      - name: Build admin web into Java server resources
        run: |
          npm --prefix apps/admin-web ci
          npm --prefix apps/admin-web run deploy:java

      - name: Test Java modules
        run: >-
          mvn -pl implementations/java/server,implementations/java/client,implementations/java/stun-server -am
          -Dspecus.server.web.skip=true -Drevision="$BUILD_VERSION" test

      - name: Package Java modules
        # -Drevision feeds the client pom's ${revision}; the jar manifest then reports the release
        # version, which is what the login handshake sends.
        run: >-
          mvn -pl implementations/java/server,implementations/java/client,implementations/java/stun-server -am
          -DskipTests -Dspecus.server.web.skip=true -Drevision="$BUILD_VERSION" clean package

      - name: Rename and checksum
        run: |
          set -euo pipefail
          dist="release-dist/java"
          mkdir -p "$dist"
          cp implementations/java/server/target/specus-server-1.0-SNAPSHOT.jar "$dist/specus-server-java-$RELEASE_VERSION.jar"
          cp "implementations/java/client/target/specus-client-$BUILD_VERSION-exec.jar" "$dist/specus-client-java-$RELEASE_VERSION.jar"
          cp implementations/java/stun-server/target/stun-server.jar "$dist/specus-stun-server-java-$RELEASE_VERSION.jar"
          (cd "$dist" && sha256sum -- *.jar > SHA256SUMS-java.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: specus-java
          path: release-dist/java/*

  csharp-server:
    name: .NET server (linux-x64)
    needs: prep
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.prep.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json

      - name: Build admin web into .NET server wwwroot
        run: |
          npm --prefix apps/admin-web ci
          npm --prefix apps/admin-web run deploy:csharp

      - name: Test .NET server
        run: >-
          dotnet test implementations/csharp/server/Specus.slnx
          -p:SpecusServerWebSkip=true

      - name: Publish .NET server
        run: >-
          dotnet publish implementations/csharp/server/src/Specus.Server
          -c Release -p:SpecusServerWebSkip=true -o out/specus-server-csharp

      - name: Package archive
        run: |
          set -euo pipefail
          pkg="specus-server-csharp-$RELEASE_VERSION-linux-x64"
          stage="out/$pkg"
          rm -rf "$stage" "release-dist/$pkg.tar.gz"
          mkdir -p "$stage" release-dist
          cp -r out/specus-server-csharp/. "$stage/"
          cp -r deploy/csharp-server/systemd "$stage/systemd"
          tar -czf "release-dist/$pkg.tar.gz" -C "$stage" .
          (cd release-dist && sha256sum "$pkg.tar.gz" > "$pkg.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: specus-server-csharp
          path: release-dist/*

  csharp-client:
    name: .NET client CLI
    needs: prep
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.prep.outputs.version }}
      BUILD_VERSION: ${{ needs.prep.outputs.build_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test .NET client
        run: >-
          dotnet test implementations/csharp/client/tests/Specus.Client.Tests/Specus.Client.Tests.csproj

      - name: Publish .NET client
        run: >-
          dotnet publish implementations/csharp/client/src/Specus.Client
          -c Release -p:Version="$BUILD_VERSION" -o out/specus-client-csharp

      - name: Package archive
        run: |
          set -euo pipefail
          pkg="specus-client-csharp-$RELEASE_VERSION"
          mkdir -p release-dist
          rm -f "release-dist/$pkg.tar.gz"
          tar -czf "release-dist/$pkg.tar.gz" -C out/specus-client-csharp .
          (cd release-dist && sha256sum "$pkg.tar.gz" > "$pkg.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: specus-client-csharp
          path: release-dist/*

  csharp-desktop:
    name: .NET desktop (win-x64)
    needs: prep
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ needs.prep.outputs.version }}
      BUILD_VERSION: ${{ needs.prep.outputs.build_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test .NET desktop solution
        shell: bash
        run: dotnet test implementations/csharp/client/Specus.Client.slnx

      - name: Publish desktop app
        shell: bash
        run: >-
          dotnet publish implementations/csharp/client/src/Specus.Client.Desktop/Specus.Client.Desktop.csproj
          -r win-x64 -c Release -p:Version="$BUILD_VERSION"
          -p:SelfContained=true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -o out/specus-desktop

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-dist
          rm -f "release-dist/specus-desktop-$RELEASE_VERSION-win-x64.zip"
          # Windows runner 的 Git Bash 没有 zip；用系统自带 bsdtar 的 -a 按扩展名写 zip。
          tar -a -cf "release-dist/specus-desktop-$RELEASE_VERSION-win-x64.zip" -C out/specus-desktop .
          (cd release-dist && sha256sum "specus-desktop-$RELEASE_VERSION-win-x64.zip" > "specus-desktop-$RELEASE_VERSION-win-x64.zip.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: specus-desktop-win-x64
          path: release-dist/*

  android-client:
    name: Android client (unsigned build)
    needs: prep
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.prep.outputs.version }}
      BUILD_VERSION: ${{ needs.prep.outputs.build_version }}
      RELEASE_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Test and lint Android client
        working-directory: implementations/android/client
        run: ./gradlew --no-daemon test lint

      - name: Build unsigned APK
        working-directory: implementations/android/client
        run: >-
          ./gradlew --no-daemon :app:assembleRelease
          -PreleaseVersion="$BUILD_VERSION"
          -PreleaseVersionCode="$RELEASE_VERSION_CODE"

      - uses: actions/upload-artifact@v4
        with:
          name: _internal-android-unsigned
          path: implementations/android/client/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  android-sign:
    name: Android client (protected signing)
    needs: [prep, android-client]
    runs-on: ubuntu-latest
    environment: release-signing
    env:
      RELEASE_VERSION: ${{ needs.prep.outputs.version }}
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/download-artifact@v4
        with:
          name: _internal-android-unsigned
          path: unsigned-apk

      - name: Sign APK and verify release certificate
        env:
          SPECUS_ANDROID_KEYSTORE_BASE64: ${{ secrets.SPECUS_ANDROID_KEYSTORE_BASE64 }}
          SPECUS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SPECUS_ANDROID_KEYSTORE_PASSWORD }}
          SPECUS_ANDROID_KEY_ALIAS: ${{ secrets.SPECUS_ANDROID_KEY_ALIAS }}
          SPECUS_ANDROID_KEY_PASSWORD: ${{ secrets.SPECUS_ANDROID_KEY_PASSWORD }}
          SPECUS_ANDROID_CERT_SHA256: ${{ secrets.SPECUS_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for value in SPECUS_ANDROID_KEYSTORE_BASE64 SPECUS_ANDROID_KEYSTORE_PASSWORD SPECUS_ANDROID_KEY_ALIAS SPECUS_ANDROID_KEY_PASSWORD SPECUS_ANDROID_CERT_SHA256; do
            [ -n "${!value:-}" ] || { echo "Missing required Android signing secret: $value" >&2; exit 1; }
          done
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          [ -x "$apksigner" ] || { echo "Android apksigner was not found" >&2; exit 1; }
          source_apk="unsigned-apk/app-release-unsigned.apk"
          [ -f "$source_apk" ] || { echo "Unsigned release APK was not found" >&2; exit 1; }
          key_path="$RUNNER_TEMP/specus-android-release.jks"
          trap 'rm -f "$key_path"' EXIT
          printf '%s' "$SPECUS_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          mkdir -p release-dist
          target="release-dist/specus-client-android-$RELEASE_VERSION.apk"
          "$apksigner" sign \
            --ks "$key_path" \
            --ks-key-alias "$SPECUS_ANDROID_KEY_ALIAS" \
            --ks-pass env:SPECUS_ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:SPECUS_ANDROID_KEY_PASSWORD \
            --out "$target" "$source_apk"
          verify_output="$("$apksigner" verify --verbose --print-certs "$target")"
          printf '%s\n' "$verify_output"
          actual_cert="$(printf '%s\n' "$verify_output" | grep -i 'certificate SHA-256 digest:' | head -n 1 | sed 's/.*SHA-256 digest:[[:space:]]*//' | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          expected_cert="$(printf '%s' "$SPECUS_ANDROID_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          [[ "$actual_cert" =~ ^[0-9a-f]{64}$ && "$actual_cert" = "$expected_cert" ]] || {
            echo "Android release certificate fingerprint does not match the protected value" >&2
            exit 1
          }
          (cd release-dist && sha256sum "$(basename "$target")" > "$(basename "$target").sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: specus-client-android
          path: release-dist/*

  c-server:
    name: C server (linux-x64)
    needs: prep
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.prep.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential zlib1g-dev libsqlite3-dev

      - name: Build C server
        run: |
          cmake -S implementations/c/server -B build/c-server -DCMAKE_BUILD_TYPE=Release
          cmake --build build/c-server --parallel

      - name: Package archive
        run: |
          set -euo pipefail
          pkg="specus-server-c-$RELEASE_VERSION-linux-x64"
          stage="out/$pkg"
          rm -rf "$stage" "release-dist/$pkg.tar.gz"
          mkdir -p "$stage" release-dist
          find build/c-server -maxdepth 2 -type f -name 'specus-server-c*' -executable
          cp "$(find build/c-server -maxdepth 2 -type f -name 'specus-server-c' -executable | head -1)" "$stage/specus-server-c"
          cp -r implementations/c/server/deploy/systemd "$stage/systemd"
          tar -czf "release-dist/$pkg.tar.gz" -C "$stage" .
          (cd release-dist && sha256sum "$pkg.tar.gz" > "$pkg.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: specus-server-c
          path: release-dist/*

  release:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    needs: [prep, go-server, go-client, java, csharp-server, csharp-client, csharp-desktop, android-sign, c-server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: "specus-*"
          path: dist
          merge-multiple: true

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -lh dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
