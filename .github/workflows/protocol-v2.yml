name: Protocol v2

on:
  pull_request:
    paths:
      - ".github/workflows/protocol-v2.yml"
      - "apps/admin-web/**"
      - "implementations/android/**"
      - "implementations/c/**"
      - "implementations/csharp/**"
      - "implementations/go/**"
      - "implementations/java/**"
      - "protocol/**"
      - "tools/loadtest/**"
      - "pom.xml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/protocol-v2.yml"
      - "apps/admin-web/**"
      - "implementations/android/**"
      - "implementations/c/**"
      - "implementations/csharp/**"
      - "implementations/go/**"
      - "implementations/java/**"
      - "protocol/**"
      - "tools/loadtest/**"
      - "pom.xml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-transfer-cluster:
    name: Public transfer cluster (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        runtime: [java, go, dotnet]
    env:
      SPECUS_TEST_REDIS_URI: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        if: matrix.runtime == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test Java cluster protocol
        if: matrix.runtime == 'java'
        run: >-
          mvn -pl implementations/java/server -am
          -DskipTests=false
          -Dtest=PublicTransferCoordinationRedisIT,PublicTransferClusterFrameTests,ConnectionEventsWebSocketHandlerTests,PublicTransferDiscoveryWebSocketHandlerTests,PublicTransferCoordinationServiceTests
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dspecus.server.web.skip=true
          test

      - name: Set up Go
        if: matrix.runtime == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: implementations/go/server/go.mod
          cache-dependency-path: implementations/go/server/go.sum

      - name: Create placeholder web assets for go:embed
        if: matrix.runtime == 'go'
        run: |
          mkdir -p implementations/go/server/web/static
          printf '<!doctype html><title>ci-placeholder</title>\n' > implementations/go/server/web/static/index.html

      - name: Test Go cluster protocol
        if: matrix.runtime == 'go'
        working-directory: implementations/go/server
        run: >-
          go test ./internal/server ./internal/wsevents
          -run 'Test(PublicTransfer(CoordinationAcrossRedisInstances|CoordinationMergesNetRoster|ClusterFrameMatchesCanonicalVector)|HubPublishesAndDeliversClusterManagementEvents)'
          -count=1

      - name: Set up .NET 10
        if: matrix.runtime == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test .NET cluster protocol
        if: matrix.runtime == 'dotnet'
        run: >-
          dotnet test
          implementations/csharp/server/tests/Specus.IntegrationTests/Specus.IntegrationTests.csproj
          -p:SpecusServerWebSkip=true
          --filter "FullyQualifiedName~PublicTransferCoordinationRedisTests|FullyQualifiedName~PublicTransferClusterFrameTests|FullyQualifiedName~PublicTransferClusterFaultToleranceTests"
          --verbosity minimal

  go-server:
    name: Go server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: implementations/go/server/go.mod
          cache-dependency-path: implementations/go/server/go.sum

      # The management SPA the server embeds is built from apps/admin-web and is not committed. A
      # placeholder satisfies the embed directive without the npm build. The favicon is the one real
      # file in it, because the static cache-header test fetches it from the embedded tree.
      - name: Create placeholder web assets for go:embed
        run: |
          mkdir -p implementations/go/server/web/static
          printf '<!doctype html><title>ci-placeholder</title>\n' > implementations/go/server/web/static/index.html
          cp apps/admin-web/public/favicon.svg implementations/go/server/web/static/favicon.svg

      # The whole suite. Only the cluster tests above ran before, which is how the server's rule
      # engine drifted from the shared rules vector without a single failing check to say so.
      - name: Test
        working-directory: implementations/go/server
        run: go test ./... -count=1

  # The Java and .NET suites ran only in the release, so a pull request could break either server
  # with every check here green. Both run whole, with the management page built as the release
  # builds it: a few tests fetch its real assets.
  java-server:
    name: Java server
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json

      - name: Build admin web into Java server resources
        run: |
          npm --prefix apps/admin-web ci
          npm --prefix apps/admin-web run deploy:java

      - name: Test Java modules
        run: >-
          mvn -B -pl implementations/java/server,implementations/java/client,implementations/java/stun-server -am
          -Dspecus.server.web.skip=true test

  dotnet-server:
    name: .NET server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json

      - name: Build admin web into .NET server wwwroot
        run: |
          npm --prefix apps/admin-web ci
          npm --prefix apps/admin-web run deploy:csharp

      - name: Test .NET server
        run: >-
          dotnet test implementations/csharp/server/Specus.slnx
          -p:SpecusServerWebSkip=true

  c-linux:
    name: C server (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21 for cross-language E2E
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Refresh package metadata
        run: sudo apt-get update
      - name: Install native dependencies
        run: sudo apt-get install -y cmake build-essential zlib1g-dev libsqlite3-dev libssl-dev libcurl4-openssl-dev libhiredis-dev libutf8proc-dev libbrotli-dev redis-server
      - name: Configure
        run: cmake -S implementations/c/server -B build/c-server -DCMAKE_BUILD_TYPE=Release
      - name: Build
        id: c-build
        run: cmake --build build/c-server --parallel
      - name: Test
        run: ctest --test-dir build/c-server --output-on-failure
      - name: Build Java reference server
        run: mvn -pl :specus-server -am package -DskipTests -Dspecus.server.web.skip=true
      - name: C and Java Redis discovery interoperability E2E
        run: timeout --preserve-status 120s bash implementations/c/server/scripts/java_c_discovery_interop.sh build/c-server/specus-server-c
      - name: Build Java reference client
        id: java-client
        run: mvn -pl :specus-client -am package -DskipTests
      # nat_e2e_smoke.sh, runtime_config_e2e.sh and direct_route_e2e.sh copy their server, client and
      # upstream logs here on exit, passed or failed; the last step uploads them for review.
      - name: Keep client E2E logs
        run: echo "SPECUS_E2E_LOG_DIR=$RUNNER_TEMP/c-server-e2e-logs" >> "$GITHUB_ENV"
      # The Makefile build is checked on its own: its unit tests take minutes, and the E2E steps below
      # each have a few minutes for the end-to-end part alone.
      - name: Makefile build and unit tests
        run: timeout --preserve-status 600s make -C implementations/c/server test
      - name: Java client NAT, heartbeat and Direct HTTP/WebSocket E2E
        run: SPECUS_SMOKE_REUSE_BUILD=1 timeout --preserve-status 180s bash implementations/c/server/scripts/nat_e2e_smoke.sh
      - name: Java client SQLite runtime configuration E2E
        if: ${{ !cancelled() && steps.c-build.outcome == 'success' && steps.java-client.outcome == 'success' }}
        run: SPECUS_SMOKE_REUSE_BUILD=1 timeout --preserve-status 180s bash implementations/c/server/scripts/runtime_config_e2e.sh
      - name: Java client Direct HTTP and WebSocket E2E
        if: ${{ !cancelled() && steps.c-build.outcome == 'success' && steps.java-client.outcome == 'success' }}
        run: SPECUS_SMOKE_REUSE_BUILD=1 timeout --preserve-status 180s bash implementations/c/server/scripts/direct_route_e2e.sh
      # PEM control/data TLS under a test CA: nettyTls is followed, a wrong CA or host name is
      # refused, and the right ones carry control, data and a TCP round trip.
      - name: Java client control TLS E2E
        if: ${{ !cancelled() && steps.c-build.outcome == 'success' && steps.java-client.outcome == 'success' }}
        run: SPECUS_SMOKE_REUSE_BUILD=1 timeout --preserve-status 180s bash implementations/c/server/scripts/tls_client_e2e.sh
      # Two clients in noop Peer Mesh mode: DIRECT beside the server, then RELAY through the C TURN
      # server from network namespaces of their own. The script re-executes itself under
      # `sudo -n unshare -n` here, so nothing it configures reaches the runner's own network.
      - name: Java client Peer Mesh signalling and TURN relay E2E
        if: ${{ !cancelled() && steps.c-build.outcome == 'success' && steps.java-client.outcome == 'success' }}
        run: SPECUS_SMOKE_REUSE_BUILD=1 timeout --preserve-status 180s bash implementations/c/server/scripts/peer_mesh_e2e.sh
      # The same E2E scripts with the Go and .NET clients, against the server the Java run above
      # already built and unit-tested. They run even when a Java step failed, so each client leaves
      # its own evidence; only a failed C build skips them.
      - name: Set up Go for the Go client
        if: ${{ !cancelled() && steps.c-build.outcome == 'success' }}
        uses: actions/setup-go@v5
        with:
          go-version-file: implementations/go/client/go.mod
          cache-dependency-path: implementations/go/client/go.sum
      - name: Go client NAT, heartbeat and Direct HTTP/WebSocket E2E
        if: ${{ !cancelled() && steps.c-build.outcome == 'success' }}
        run: |
          (cd implementations/go/client && CGO_ENABLED=0 go build -o "$RUNNER_TEMP/specus-client-go" ./cmd/specus-client)
          SPECUS_CLIENT_COMMAND="$RUNNER_TEMP/specus-client-go" SPECUS_CLIENT_LABEL=Go SPECUS_SMOKE_REUSE_BUILD=1 \
            timeout --preserve-status 180s bash implementations/c/server/scripts/nat_e2e_smoke.sh
      - name: Go client SQLite runtime configuration E2E
        if: ${{ !cancelled() && steps.c-build.outcome == 'success' }}
        run: |
          SPECUS_CLIENT_COMMAND="$RUNNER_TEMP/specus-client-go" SPECUS_CLIENT_LABEL=Go SPECUS_SMOKE_REUSE_BUILD=1 \
            timeout --preserve-status 180s bash implementations/c/server/scripts/runtime_config_e2e.sh
      - name: Go client Direct HTTP and WebSocket E2E
        if: ${{ !cancelled() && steps.c-build.outcome == 'success' }}
        run: |
          SPECUS_CLIENT_COMMAND="$RUNNER_TEMP/specus-client-go" SPECUS_CLIENT_LABEL=Go SPECUS_SMOKE_REUSE_BUILD=1 \
            timeout --preserve-status 180s bash implementations/c/server/scripts/direct_route_e2e.sh
      - name: Go client control TLS E2E
        if: ${{ !cancelled() && steps.c-build.outcome == 'success' }}
        run: |
          SPECUS_CLIENT_COMMAND="$RUNNER_TEMP/specus-client-go" SPECUS_CLIENT_LABEL=Go SPECUS_SMOKE_REUSE_BUILD=1 \
            timeout --preserve-status 180s bash implementations/c/server/scripts/tls_client_e2e.sh
      - name: Go client Peer Mesh signalling and TURN relay E2E
        if: ${{ !cancelled() && steps.c-build.outcome == 'success' }}
        run: |
          SPECUS_CLIENT_COMMAND="$RUNNER_TEMP/specus-client-go" SPECUS_CLIENT_LABEL=Go SPECUS_SMOKE_REUSE_BUILD=1 \
            timeout --preserve-status 180s bash implementations/c/server/scripts/peer_mesh_e2e.sh
      - name: Set up .NET 10 for the .NET client
        if: ${{ !cancelled() && steps.c-build.outcome == 'success' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: .NET client NAT, heartbeat and Direct HTTP/WebSocket E2E
        if: ${{ !cancelled() && steps.c-build.outcome == 'success' }}
        run: |
          dotnet build implementations/csharp/client/src/Specus.Client/Specus.Client.csproj -c Release -v quiet
          dll="$GITHUB_WORKSPACE/implementations/csharp/client/src/Specus.Client/bin/Release/net10.0/specus-client.dll"
          SPECUS_CLIENT_COMMAND="dotnet $dll" SPECUS_CLIENT_LABEL=.NET SPECUS_SMOKE_REUSE_BUILD=1 \
            timeout --preserve-status 180s bash implementations/c/server/scripts/nat_e2e_smoke.sh
      - name: .NET client SQLite runtime configuration E2E
        if: ${{ !cancelled() && steps.c-build.outcome == 'success' }}
        run: |
          dll="$GITHUB_WORKSPACE/implementations/csharp/client/src/Specus.Client/bin/Release/net10.0/specus-client.dll"
          SPECUS_CLIENT_COMMAND="dotnet $dll" SPECUS_CLIENT_LABEL=.NET SPECUS_SMOKE_REUSE_BUILD=1 \
            timeout --preserve-status 180s bash implementations/c/server/scripts/runtime_config_e2e.sh
      - name: .NET client Direct HTTP and WebSocket E2E
        if: ${{ !cancelled() && steps.c-build.outcome == 'success' }}
        run: |
          dll="$GITHUB_WORKSPACE/implementations/csharp/client/src/Specus.Client/bin/Release/net10.0/specus-client.dll"
          SPECUS_CLIENT_COMMAND="dotnet $dll" SPECUS_CLIENT_LABEL=.NET SPECUS_SMOKE_REUSE_BUILD=1 \
            timeout --preserve-status 180s bash implementations/c/server/scripts/direct_route_e2e.sh
      - name: .NET client control TLS E2E
        if: ${{ !cancelled() && steps.c-build.outcome == 'success' }}
        run: |
          dll="$GITHUB_WORKSPACE/implementations/csharp/client/src/Specus.Client/bin/Release/net10.0/specus-client.dll"
          SPECUS_CLIENT_COMMAND="dotnet $dll" SPECUS_CLIENT_LABEL=.NET SPECUS_SMOKE_REUSE_BUILD=1 \
            timeout --preserve-status 180s bash implementations/c/server/scripts/tls_client_e2e.sh
      - name: .NET client Peer Mesh signalling and TURN relay E2E
        if: ${{ !cancelled() && steps.c-build.outcome == 'success' }}
        run: |
          dll="$GITHUB_WORKSPACE/implementations/csharp/client/src/Specus.Client/bin/Release/net10.0/specus-client.dll"
          SPECUS_CLIENT_COMMAND="dotnet $dll" SPECUS_CLIENT_LABEL=.NET SPECUS_SMOKE_REUSE_BUILD=1 \
            timeout --preserve-status 180s bash implementations/c/server/scripts/peer_mesh_e2e.sh
      # The Android client core (SpecusCore.Runtime) on this JVM: :app:jvmClientLauncher writes a
      # launcher for JvmClientMain from its unit-test sources, which takes the same arguments as the
      # other clients (and answers `peers` for the Peer Mesh roster checks). It runs without a VPN
      # platform, as peerMeshDevice=noop; foreground service, VpnService/TUN and UI stay with the
      # device tests. The runner image ships the Android SDK the Gradle build needs.
      - name: Set up Gradle for the Android client
        if: ${{ !cancelled() && steps.c-build.outcome == 'success' }}
        uses: gradle/actions/setup-gradle@v4
      - name: Build the Android client for the JVM
        id: android-client
        if: ${{ !cancelled() && steps.c-build.outcome == 'success' }}
        working-directory: implementations/android/client
        run: ./gradlew :app:jvmClientLauncher --no-daemon
      - name: Android client NAT, heartbeat and Direct HTTP/WebSocket E2E
        if: ${{ !cancelled() && steps.c-build.outcome == 'success' && steps.android-client.outcome == 'success' }}
        run: |
          SPECUS_CLIENT_COMMAND="$GITHUB_WORKSPACE/implementations/android/client/app/build/jvm-client/specus-android-jvm-client" \
          SPECUS_CLIENT_LABEL=Android SPECUS_SMOKE_REUSE_BUILD=1 \
            timeout --preserve-status 180s bash implementations/c/server/scripts/nat_e2e_smoke.sh
      - name: Android client SQLite runtime configuration E2E
        if: ${{ !cancelled() && steps.c-build.outcome == 'success' && steps.android-client.outcome == 'success' }}
        run: |
          SPECUS_CLIENT_COMMAND="$GITHUB_WORKSPACE/implementations/android/client/app/build/jvm-client/specus-android-jvm-client" \
          SPECUS_CLIENT_LABEL=Android SPECUS_SMOKE_REUSE_BUILD=1 \
            timeout --preserve-status 180s bash implementations/c/server/scripts/runtime_config_e2e.sh
      - name: Android client Direct HTTP and WebSocket E2E
        if: ${{ !cancelled() && steps.c-build.outcome == 'success' && steps.android-client.outcome == 'success' }}
        run: |
          SPECUS_CLIENT_COMMAND="$GITHUB_WORKSPACE/implementations/android/client/app/build/jvm-client/specus-android-jvm-client" \
          SPECUS_CLIENT_LABEL=Android SPECUS_SMOKE_REUSE_BUILD=1 \
            timeout --preserve-status 180s bash implementations/c/server/scripts/direct_route_e2e.sh
      - name: Android client control TLS E2E
        if: ${{ !cancelled() && steps.c-build.outcome == 'success' && steps.android-client.outcome == 'success' }}
        run: |
          SPECUS_CLIENT_COMMAND="$GITHUB_WORKSPACE/implementations/android/client/app/build/jvm-client/specus-android-jvm-client" \
          SPECUS_CLIENT_LABEL=Android SPECUS_SMOKE_REUSE_BUILD=1 \
            timeout --preserve-status 180s bash implementations/c/server/scripts/tls_client_e2e.sh
      - name: Android client Peer Mesh signalling and TURN relay E2E
        if: ${{ !cancelled() && steps.c-build.outcome == 'success' && steps.android-client.outcome == 'success' }}
        run: |
          SPECUS_CLIENT_COMMAND="$GITHUB_WORKSPACE/implementations/android/client/app/build/jvm-client/specus-android-jvm-client" \
          SPECUS_CLIENT_LABEL=Android SPECUS_SMOKE_REUSE_BUILD=1 \
            timeout --preserve-status 180s bash implementations/c/server/scripts/peer_mesh_e2e.sh

      - name: Validate netem helper
        run: bash -n tools/loadtest/netem-profile.sh
      - name: Upload client E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c-server-e2e-logs
          path: ${{ runner.temp }}/c-server-e2e-logs
          if-no-files-found: warn
          retention-days: 14

  admin-web:
    name: Admin web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - name: Install dependencies
        working-directory: apps/admin-web
        run: npm ci
      - name: Test
        working-directory: apps/admin-web
        run: npm test
      - name: Validate Peer Service wire fixtures against shared schemas
        working-directory: apps/admin-web
        run: npm run verify:peer-service-wire
      - name: Build
        working-directory: apps/admin-web
        run: npm run build

      # The build regenerates public/schemas from protocol/schemas, deleting the directory first.
      # Both are committed, so a schema edited only in the generated copy is reverted by the next
      # build anywhere -- which is how the egress definitions went missing from protocol/schemas.
      # After the build the generated copy must be exactly what is committed.
      - name: Generated schemas match their source
        run: |
          if ! git diff --exit-code -- apps/admin-web/public/schemas; then
            echo "apps/admin-web/public/schemas is generated from protocol/schemas; edit the source and run npm run sync:schemas"
            exit 1
          fi

  android:
    name: Android protocol client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and assemble
        working-directory: implementations/android/client
        run: ./gradlew test assembleDebug --no-daemon

  benchmark-builds:
    name: Protocol benchmark (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [java, go, dotnet]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        if: matrix.runtime == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build Java JMH benchmark
        if: matrix.runtime == 'java'
        run: >-
          mvn -pl implementations/java/client -am
          -Ppeer-mesh-benchmark
          -DskipTests
          package

      - name: Set up Go
        if: matrix.runtime == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: implementations/go/client/go.mod
          cache-dependency-path: implementations/go/client/go.sum

      - name: Run Go codec benchmark smoke test
        if: matrix.runtime == 'go'
        working-directory: implementations/go/client
        run: >-
          go test ./internal/client
          -run '^$'
          -bench BenchmarkPeerDataFrameCodec
          -benchmem
          -benchtime 100ms

      - name: Build TCP capacity helper
        if: matrix.runtime == 'go'
        run: go build -o /tmp/tcp-stream-load ./tools/loadtest/tcp_stream_load.go

      - name: Set up .NET 10
        if: matrix.runtime == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build .NET BenchmarkDotNet project
        if: matrix.runtime == 'dotnet'
        run: >-
          dotnet build
          implementations/csharp/client/benchmarks/Specus.Client.Benchmarks/Specus.Client.Benchmarks.csproj
          -c Release
          --verbosity minimal
