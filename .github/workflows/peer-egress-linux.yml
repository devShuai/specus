name: Peer egress Linux routes

# Route takeover on Linux, against a real routing table.
#
# The route commanders had never changed a Linux table in CI: installing a route needs
# CAP_NET_ADMIN, and doing it on the runner's own table would change the machine the job runs on.
# A network namespace answers both. `sudo unshare -n` starts the test binary as root in a namespace
# with nothing in it, and the tests build their own interfaces, TUN device and routes there. They
# refuse to run in any namespace whose main table is not empty when they start, so the same binary
# run by hand on a real machine skips instead of rearranging its routes.

on:
  pull_request:
    paths:
      - '.github/workflows/peer-egress-linux.yml'
      - 'protocol/test-vectors/peer-egress-socket-binding-v1.json'
      - 'tools/protocol/generate_peer_egress_socket_binding_vectors.py'
      - 'implementations/go/client/internal/client/peer_egress_route_*'
      - 'implementations/go/client/internal/client/peer_egress_bind*'
  push:
    branches: [main]
    paths:
      - '.github/workflows/peer-egress-linux.yml'
      - 'protocol/test-vectors/peer-egress-socket-binding-v1.json'
      - 'implementations/go/client/internal/client/peer_egress_route_*'
      - 'implementations/go/client/internal/client/peer_egress_bind*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routes:
    name: Route takeover (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: implementations/go/client/go.mod
          cache-dependency-path: implementations/go/client/go.sum

      # Compiled first and then run under sudo, rather than running the whole suite elevated, so
      # nothing else leaves root-owned files behind in a build cache.
      #
      # The output is searched for the tests by name, because they skip themselves when the
      # namespace is not theirs and a skipped test leaves this step green.
      - name: Install bypass routes under the tunnel's own routes
        working-directory: implementations/go/client
        run: |
          set -o pipefail
          go test -c -o "$RUNNER_TEMP/client.test" ./internal/client
          cd "$GITHUB_WORKSPACE"
          sudo -n unshare -n env SPECUS_ROUTE_MUTATION_TEST=1 "$RUNNER_TEMP/client.test" \
            -test.run 'TestLinuxCommander' -test.v | tee "$RUNNER_TEMP/linux.log"
          for name in InstallsABypassUnderItsOwnTunnelRoute RefusesABypassOnlyABlackholeWouldCarry \
              RepairsARouteTheTableLost; do
            if ! grep -q "^--- PASS: TestLinuxCommander$name" "$RUNNER_TEMP/linux.log"; then
              echo "TestLinuxCommander$name did not run against a real routing table"
              exit 1
            fi
          done

      # The namespace is gone with the process, so nothing can be left in the runner's own table.
      # Checked anyway: a test that wrote to the wrong namespace would show up here.
      - name: No residue in the runner's table
        if: always()
        run: |
          ip -4 route show table main
          if ip -4 route show table main | grep -E '^(203\.0\.113|192\.0\.2)' || ip link show specus0 2>/dev/null; then
            echo "a test route or device reached the runner's own namespace"
            exit 1
          fi
