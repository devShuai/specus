name: Peer egress Linux routes

# Route takeover on Linux, against a real routing table.
#
# The route commanders had never changed a Linux table in CI: installing a route needs
# CAP_NET_ADMIN, and doing it on the runner's own table would change the machine the job runs on.
# A network namespace answers both. `sudo unshare -n` starts the test binary as root in a namespace
# with nothing in it, and the tests build their own interfaces, TUN device and routes there. They
# refuse to run in any namespace whose main table is not empty when they start, so the same binary
# run by hand on a real machine skips instead of rearranging its routes.

on:
  pull_request:
    paths:
      - '.github/workflows/peer-egress-linux.yml'
      - 'protocol/test-vectors/peer-egress-socket-binding-v1.json'
      - 'tools/protocol/generate_peer_egress_socket_binding_vectors.py'
      - 'implementations/go/client/internal/client/peer_egress_route_*'
      - 'implementations/go/client/internal/client/peer_egress_bind*'
      - 'implementations/go/client/internal/client/peer_device_linux*'
      - 'implementations/csharp/client/src/Specus.Client/PeerMesh/PeerVirtualDevice.cs'
      - 'implementations/csharp/client/tests/Specus.Client.Tests/LinuxTunDeviceTests.cs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/peer-egress-linux.yml'
      - 'protocol/test-vectors/peer-egress-socket-binding-v1.json'
      - 'implementations/go/client/internal/client/peer_egress_route_*'
      - 'implementations/go/client/internal/client/peer_egress_bind*'
      - 'implementations/go/client/internal/client/peer_device_linux*'
      - 'implementations/csharp/client/src/Specus.Client/PeerMesh/PeerVirtualDevice.cs'
      - 'implementations/csharp/client/tests/Specus.Client.Tests/LinuxTunDeviceTests.cs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routes:
    name: Route takeover (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: implementations/go/client/go.mod
          cache-dependency-path: implementations/go/client/go.sum
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Compiled first and then run under sudo, rather than running the whole suite elevated, so
      # nothing else leaves root-owned files behind in a build cache.
      #
      # The output is searched for the tests by name, because they skip themselves when the
      # namespace is not theirs and a skipped test leaves this step green.
      - name: Install bypass routes under the tunnel's own routes, and read from a real TUN
        working-directory: implementations/go/client
        run: |
          set -o pipefail
          go test -c -o "$RUNNER_TEMP/client.test" ./internal/client
          cd "$GITHUB_WORKSPACE"
          sudo -n unshare -n env SPECUS_ROUTE_MUTATION_TEST=1 "$RUNNER_TEMP/client.test" \
            -test.run 'TestLinuxCommander|TestLinuxTunDevice' -test.v | tee "$RUNNER_TEMP/linux.log"
          for name in TestLinuxCommanderInstallsABypassUnderItsOwnTunnelRoute \
              TestLinuxCommanderRefusesABypassOnlyABlackholeWouldCarry \
              TestLinuxCommanderRepairsARouteTheTableLost \
              TestLinuxTunDeviceDeliversWhatTheKernelWritesIntoIt; do
            if ! grep -q "^--- PASS: $name" "$RUNNER_TEMP/linux.log"; then
              echo "$name did not run against a real interface"
              exit 1
            fi
          done

      # The .NET TUN device the same way: built as the runner user, run as root in a namespace of
      # its own, and searched for by name afterwards. Loopback comes up first because the test host
      # talks to its runner over it; the test itself refuses a namespace whose main table is not
      # empty.
      - name: Replace a real .NET TUN device under the same name
        run: |
          set -o pipefail
          project=implementations/csharp/client/tests/Specus.Client.Tests/Specus.Client.Tests.csproj
          dotnet build "$project" -c Release -v quiet
          sudo -n unshare -n env SPECUS_ROUTE_MUTATION_TEST=1 DOTNET_NOLOGO=1               DOTNET_CLI_HOME="$RUNNER_TEMP/dotnet-home" DOTNET_ROOT="$DOTNET_ROOT"               NUGET_PACKAGES="$HOME/.nuget/packages"               sh -c 'ip link set lo up && exec "$0" test "$1" -c Release --no-build                 --filter FullyQualifiedName~LinuxTunDeviceTests --logger "console;verbosity=normal"'               "$(command -v dotnet)" "$project" | tee "$RUNNER_TEMP/dotnet-tun.log"
          name=Specus.Client.Tests.LinuxTunDeviceTests.ADeviceReplacedUnderTheSameNameStartsEveryTime
          if ! grep -q "Passed $name" "$RUNNER_TEMP/dotnet-tun.log"; then
            echo "$name did not run against a real interface"
            exit 1
          fi

      # The namespace is gone with the process, so nothing can be left in the runner's own table.
      # Checked anyway: a test that wrote to the wrong namespace would show up here.
      - name: No residue in the runner's table
        if: always()
        run: |
          ip -4 route show table main
          if ip -4 route show table main | grep -E '^(203\.0\.113|192\.0\.2)' || ip link show specus0 2>/dev/null; then
            echo "a test route or device reached the runner's own namespace"
            exit 1
          fi
