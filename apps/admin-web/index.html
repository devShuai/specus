<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />

    <link rel="icon" href="/favicon.ico" sizes="any" />

    <style>
      .boot-shell {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #030509;
      }

      .boot-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(153, 246, 228, 0.18);
        border-top-color: #67e8f9;
        border-radius: 999px;
        animation: boot-spin 0.8s linear infinite;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-color-scheme: light) {
        .boot-shell {
          background: #f8fbff;
        }

        .boot-spinner {
          border-color: rgba(8, 145, 178, 0.14);
          border-top-color: #0891b2;

    <!--

    <title>shuai-tunnel · 自托管内网穿透 / HTTP 反向代理 / 对端互联控制面</title>
    <meta name="description" content="shuai-tunnel 是一套自托管的内网穿透控制面，支持 TCP 端口映射、HTTP 反向代理（含路径改写）、私有组网对端互联与浏览器 NAT 类型检测，自带 Java / Go / .NET 多语言客户端。" />
    <meta name="keywords" content="内网穿透,NAT 检测,WebRTC NAT,STUN 探测,Symmetric NAT,Full Cone NAT,内网映射,HTTP 反向代理,对端互联,Peer Mesh,P2P 打洞,frp 替代,自托管,shuai-tunnel" />
    <meta name="author" content="devShuai" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="canonical" href="https://tunnel.devshuai.com/" />

    <!-- Open Graph / Twitter / 微信分享卡片 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="shuai-tunnel" />
    <meta property="og:title" content="shuai-tunnel · 自托管内网穿透 / 对端互联控制面" />

        "@context": "https://schema.org",

    <!-- Google tag (gtag.js)
         主 loader 走外部 CDN（CSP 单独放行 googletagmanager.com）。
         初始化逻辑同时内联在下方 + 备份在同源 /gtag-init.js 中：
         - 内联版本：让 Google Search Console / Analytics 所有权验证器能从纯
           HTML 扫到 gtag('config','G-...') 这段；它不执行 JS。
         - page_location / page_path 只包含 origin 与 pathname，不上报 query/hash 中的房间凭据。
         - 内联脚本 sha256 hash 已加入 CSP script-src 白名单。 -->
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-TNJRNXHJ40',{page_location:location.origin+location.pathname,page_path:location.pathname});</script>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell">
        <span class="boot-spinner" aria-label="加载中"></span>
      </div>
    </div>
    <noscript>
      <h1>shuai-tunnel · 自托管内网穿透控制面</h1>
      <p>
        shuai-tunnel 是一套支持 TCP 端口映射、HTTP 反向代理、私有组网对端互联与浏览器 NAT 类型检测的自托管控制面。
        本页面使用 JavaScript 渲染，请启用 JS 后查看控制台与在线检测工具。
      </p>
      <p>主要功能：</p>
      <ul>
        <li>TCP 端口映射 — 把内网端口映射到公网</li>
        <li>HTTP 反向代理 — 支持路径改写的 HTTP/WebSocket 反向代理</li>
        <li>Peer Mesh — 客户端之间对端互联，UDP 打洞 + 内置标准 STUN/TURN 子集回退</li>
        <li>浏览器 NAT 检测 — 在线判断当前网络的 NAT 类型与直连可行性</li>
      </ul>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TNJRNXHJ40"></script>
