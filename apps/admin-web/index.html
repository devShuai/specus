<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#05070c" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      .boot-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        gap: 48px;
        padding: 24px clamp(20px, 5vw, 72px);
        color: #f8fafc;
        background:
          linear-gradient(180deg, rgba(3, 7, 18, 0.08), rgba(3, 7, 18, 0.92)),
          radial-gradient(circle at 18% 18%, rgba(34, 211, 238, 0.16), transparent 34%),
          radial-gradient(circle at 76% 28%, rgba(16, 185, 129, 0.12), transparent 30%),
          #030509;
      }

      .boot-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .boot-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font: 700 18px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .boot-mark {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: linear-gradient(135deg, #22d3ee, #34d399);
        box-shadow: 0 0 32px rgba(34, 211, 238, 0.28);
      }

      .boot-body {
        width: min(760px, 100%);
        margin-top: min(12vh, 120px);
      }

      .boot-eyebrow {
        display: inline-flex;
        padding: 5px 10px;
        border: 1px solid rgba(94, 234, 212, 0.35);
        border-radius: 6px;
        color: #a7f3d0;
        background: rgba(20, 184, 166, 0.12);
        font: 500 13px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .boot-title {
        margin: 28px 0 0;
        font: 700 clamp(42px, 8vw, 78px)/0.96 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      .boot-copy {
        max-width: 680px;
        margin: 22px 0 0;
        color: #cbd5e1;
        font: 400 clamp(16px, 2vw, 20px)/1.8 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .boot-loading {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 32px;
        color: #99f6e4;
        font: 500 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .boot-loading::before {
        width: 14px;
        height: 14px;
        content: "";
        border: 2px solid rgba(153, 246, 228, 0.28);
        border-top-color: #67e8f9;
        border-radius: 999px;
        animation: boot-spin 0.9s linear infinite;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-color-scheme: light) {
        .boot-shell {
          color: #0f172a;
          background:
            linear-gradient(180deg, rgba(248, 250, 252, 0.24), rgba(248, 250, 252, 0.95)),
            radial-gradient(circle at 18% 18%, rgba(8, 145, 178, 0.16), transparent 34%),
            radial-gradient(circle at 76% 28%, rgba(16, 185, 129, 0.12), transparent 30%),
            #f8fbff;
        }

        .boot-eyebrow {
          color: #047857;
          background: rgba(16, 185, 129, 0.1);
        }

        .boot-copy {
          color: #475569;
        }

        .boot-loading {
          color: #0891b2;
        }
      }
    </style>

    <!--
      SEO 默认值（首页/landing）；进入具体路由时由 src/lib/seo.ts 动态覆写。
      关键词围绕国内可搜索的高频长尾：内网穿透、HTTP 反向代理、对端互联、NAT 类型检测等。
    -->
    <title>shuai-tunnel · 自托管内网穿透 / HTTP 反向代理 / 对端互联控制面</title>
    <meta name="description" content="shuai-tunnel 是一套自托管的内网穿透控制面，支持 TCP 端口映射、HTTP 反向代理（含路径改写）、私有组网对端互联与浏览器 NAT 类型检测，自带 Java / Go / .NET 多语言客户端。" />
    <meta name="keywords" content="内网穿透,NAT 检测,WebRTC NAT,STUN 探测,Symmetric NAT,Full Cone NAT,内网映射,HTTP 反向代理,对端互联,Peer Mesh,P2P 打洞,frp 替代,自托管,shuai-tunnel" />
    <meta name="author" content="devShuai" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="canonical" href="https://tunnel.devshuai.com/" />

    <!-- Open Graph / Twitter / 微信分享卡片 -->

    <meta property="og:site_name" content="shuai-tunnel" />
    <meta property="og:title" content="shuai-tunnel · 自托管内网穿透 / 对端互联控制面" />

    <meta property="og:url" content="https://tunnel.devshuai.com/" />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary_large_image" />

      {
        "@context": "https://schema.org",

    <!-- Google tag (gtag.js)
         主 loader 走外部 CDN（CSP 单独放行 googletagmanager.com）。
         初始化逻辑同时内联在下方 + 备份在同源 /gtag-init.js 中：
         - 内联版本：让 Google Search Console / Analytics 所有权验证器能从纯
           HTML 扫到 gtag('config','G-...') 这段；它不执行 JS。
         - 内联脚本 sha256 hash 已加入 CSP script-src 白名单。 -->
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-TNJRNXHJ40');</script>
  </head>
  <body>
    <div id="root">
      <main class="boot-shell" aria-label="shuai-tunnel 首屏">
        <header class="boot-header">
          <div class="boot-brand">
            <span class="boot-mark" aria-hidden="true"></span>
            <span>shuai-tunnel</span>
          </div>
        </header>
        <section class="boot-body">
          <span class="boot-eyebrow">Secure tunnel control plane</span>
          <h1 class="boot-title">shuai-tunnel</h1>
          <p class="boot-copy">把公网入口、对端互联与内网服务发布收束到一个控制面，多语言客户端、多租户、可观测，TLS 开箱即用。</p>
          <span class="boot-loading">正在加载控制台</span>

      </main>
    </div>
    <noscript>
      <h1>shuai-tunnel · 自托管内网穿透控制面</h1>
      <p>
        shuai-tunnel 是一套支持 TCP 端口映射、HTTP 反向代理、私有组网对端互联与浏览器 NAT 类型检测的自托管控制面。
        本页面使用 JavaScript 渲染，请启用 JS 后查看控制台与在线检测工具。

      </ul>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TNJRNXHJ40"></script>
  </body>
</html>
