<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>shuai-tunnel 管理后台</title>
  <style>
    :root { color-scheme: light; --bg:#f4f7fb; --panel:#fff; --ink:#1c2533; --muted:#667085; --line:#e3e8ef; --brand:#1769e0; --danger:#c93636; }
    * { box-sizing:border-box; }
    body { margin:0; font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); }
    header { display:flex; justify-content:space-between; align-items:center; padding:20px 28px; color:#fff; background:#142238; }
    h1,h2 { margin:0; } h1 { font-size:20px; } h2 { margin-bottom:14px; font-size:17px; }
    main { max-width:1440px; margin:auto; padding:20px; }
    .grid { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:12px; margin-bottom:18px; }
    .stat,.panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:0 2px 10px #1422380d; }
    .stat { padding:14px; } .stat span { display:block; color:var(--muted); font-size:12px; } .stat strong { font-size:21px; }
    .panel { margin-bottom:18px; padding:16px; overflow:auto; }
    .toolbar,.form { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
    input,button { border:1px solid var(--line); border-radius:6px; padding:8px 10px; background:#fff; }
    input { min-width:150px; } button { cursor:pointer; color:#fff; border-color:var(--brand); background:var(--brand); }
    button.secondary { color:var(--ink); border-color:var(--line); background:#fff; } button.danger { border-color:var(--danger); background:var(--danger); }
    table { width:100%; min-width:920px; border-collapse:collapse; }
    th,td { padding:9px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
    th { color:var(--muted); font-size:12px; font-weight:600; }
    code { padding:2px 5px; border-radius:4px; background:#eef2f7; }
    .ok { color:#087443; } .off { color:var(--danger); } .muted { color:var(--muted); }
    #notice { display:none; margin-bottom:14px; padding:10px 12px; border-radius:6px; background:#e9f4ff; }
    [hidden] { display:none !important; }
    .login-overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); z-index:100; }
    .login-card { width:min(380px,92vw); padding:32px 28px; text-align:center; background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:0 18px 50px #1422381f; }
    .login-card h1 { font-size:20px; margin-bottom:6px; }
    .login-card p { color:var(--muted); margin:0 0 20px; }
    .login-card button { width:100%; padding:11px; font-size:15px; }
    .login-form { display:flex; flex-direction:column; gap:10px; margin-bottom:6px; }
    .login-form input { width:100%; min-width:0; }
    .login-divider { color:var(--muted); font-size:12px; margin:12px 0; }
    @media (max-width:900px) { .grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  </style>
</head>
<body>
<div id="login" class="login-overlay" hidden>
  <div class="login-card">
    <h1>shuai-tunnel 管理后台</h1>
    <p id="loginHint">请登录</p>
    <form id="pwForm" class="login-form" onsubmit="passwordLogin(event)" hidden>
      <input id="pwUser" placeholder="用户名" autocomplete="username">
      <input id="pwPass" type="password" placeholder="密码" autocomplete="current-password">
      <button type="submit">登录</button>
    </form>
    <div id="loginDivider" class="login-divider" hidden>或</div>
    <button id="loginButton" class="secondary" onclick="login()" hidden>使用 OIDC 登录</button>
  </div>
</div>
<header id="appHeader" hidden>
  <h1>shuai-tunnel 管理后台</h1>
  <div style="display:flex;gap:8px;align-items:center">
    <button class="secondary" onclick="initializeDatabase()">初始化数据库</button>
    <button class="secondary" onclick="logout()">退出登录</button>
  </div>
</header>
<main id="appMain" hidden>
  <div id="notice"></div>
  <section id="overview" class="grid"></section>

  <section class="panel">
    <h2>客户端管理</h2>
    <form class="form" onsubmit="createClient(event)">
      <input id="clientName" required placeholder="客户端名称">
      <input id="password" placeholder="密码（留空自动生成）">
      <input id="rateLimit" type="number" min="0" max="10000" value="30" placeholder="每分钟连接次数">
      <button type="submit">创建客户端</button>
      <button type="button" class="secondary" onclick="loadAll()">刷新</button>
    </form>
    <table>
      <thead><tr><th>ID</th><th>客户端</th><th>状态</th><th>每分钟连接上限</th><th>上传</th><th>下载</th><th>创建时间</th><th>操作</th></tr></thead>
      <tbody id="clients"></tbody>
    </table>
  </section>

  <section class="panel">
    <h2>端口映射（NAT）</h2>
    <form class="form" onsubmit="createTunnel(event)">
      <select id="tunnelClientId" required></select>
      <input id="listenPort" type="number" min="1" max="65535" required placeholder="公网端口">
      <input id="targetAddress" required placeholder="内网地址，如 127.0.0.1">
      <input id="targetPort" type="number" min="1" max="65535" required placeholder="内网端口">
      <button type="submit">新增映射</button>
    </form>
    <table>
      <thead><tr><th>ID</th><th>客户端</th><th>公网端口</th><th>内网目标</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
      <tbody id="tunnels"></tbody>
    </table>
    <p class="muted">提示：客户端登录、新增映射和删除映射时都会自动同步当前启用的映射；也可以在“客户端管理”中点击“下发映射”手动同步。</p>
  </section>

  <section class="panel">
    <h2>连接记录</h2>
    <table>
      <thead><tr><th>ID</th><th>客户端</th><th>结果</th><th>远端地址</th><th>连接时间</th><th>断开时间</th><th>原因</th></tr></thead>
      <tbody id="connections"></tbody>
    </table>
  </section>

  <section class="panel">
    <h2>流量使用</h2>
    <table>
      <thead><tr><th>ID</th><th>客户端</th><th>日期（UTC）</th><th>上传</th><th>下载</th><th>更新时间</th></tr></thead>
      <tbody id="traffic"></tbody>
    </table>
  </section>
</main>
<script>
let clientCache = new Map();
const safeJson = async response => { try { return await response.json(); } catch { return {}; } };
const api = async (path, options = {}) => {
  const headers = { 'Content-Type':'application/json', ...(options.headers || {}) };
  const token = sessionStorage.getItem('access_token');
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const response = await fetch(`/api/admin${path}`, { ...options, headers });
  if (response.status === 401) { handleUnauthorized(); throw new Error('登录已过期，请重新登录'); }
  if (!response.ok) throw new Error((await safeJson(response)).error || response.statusText);
  return response.status === 204 ? null : response.json();
};
const formatBytes = value => {
  const units = ['B','KB','MB','GB','TB']; let index = 0; let size = Number(value || 0);
  while (size >= 1024 && index < units.length - 1) { size /= 1024; index++; }
  return `${size.toFixed(index ? 2 : 0)} ${units[index]}`;
};
const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
const notice = (message, error = false) => {
  const element = document.querySelector('#notice'); element.style.display = 'block';
  element.style.background = error ? '#fff0f0' : '#e9f4ff'; element.textContent = message;
};
async function loadAll() {
  try {
    const [overview, clients, tunnels, connections, traffic] = await Promise.all([
      api('/overview'), api('/clients'), api('/tunnels'), api('/connections?limit=100'), api('/traffic?limit=100')
    ]);
    clientCache = new Map(clients.map(client => [client.id, client]));
    document.querySelector('#overview').innerHTML = [
      ['客户端', overview.clients], ['在线', overview.onlineClients], ['成功连接', overview.successfulConnections],
      ['失败连接', overview.failedConnections], ['上传', formatBytes(overview.uploadBytes)], ['下载', formatBytes(overview.downloadBytes)]
    ].map(([label,value]) => `<div class="stat"><span>${label}</span><strong>${value}</strong></div>`).join('');
    document.querySelector('#clients').innerHTML = clients.map(client => `<tr>
      <td>${client.id}</td><td><code>${escapeHtml(client.clientName)}</code></td>
      <td class="${client.online ? 'ok' : 'muted'}">${client.online ? '在线' : '离线'} / ${client.enabled ? '启用' : '停用'}</td>
      <td>${client.connectionRateLimitPerMinute || '不限'}</td><td>${formatBytes(client.uploadBytes)}</td><td>${formatBytes(client.downloadBytes)}</td>
      <td>${escapeHtml(client.createdAt)}</td><td>
        <button class="secondary" onclick="editClient(${client.id})">编辑</button>
        <button class="secondary" onclick="pushNatControl(${client.id})">下发映射</button>
        <button class="danger" onclick="deleteClient(${client.id})">删除</button>
      </td></tr>`).join('');
    document.querySelector('#tunnelClientId').innerHTML = clients.map(client =>
      `<option value="${client.id}">${escapeHtml(client.clientName)}</option>`).join('');
    document.querySelector('#tunnels').innerHTML = tunnels.map(item => `<tr>
      <td>${item.id}</td><td>${escapeHtml(item.clientName)}</td><td><code>${item.listenPort}</code></td>
      <td><code>${escapeHtml(item.targetAddress)}:${item.targetPort}</code></td>
      <td class="${item.enabled ? 'ok' : 'muted'}">${item.enabled ? '启用' : '停用'}</td>
      <td>${escapeHtml(item.createdAt)}</td>
      <td><button class="danger" onclick="deleteTunnel(${item.id})">删除</button></td></tr>`).join('');
    document.querySelector('#connections').innerHTML = connections.map(item => `<tr>
      <td>${item.id}</td><td>${escapeHtml(item.clientName)}</td><td class="${item.success ? 'ok' : 'off'}">${item.success ? '成功' : '失败'}</td>
      <td>${escapeHtml(item.remoteAddress)}</td><td>${escapeHtml(item.connectedAt)}</td><td>${escapeHtml(item.disconnectedAt || '-')}</td><td>${escapeHtml(item.failureReason || '-')}</td></tr>`).join('');
    document.querySelector('#traffic').innerHTML = traffic.map(item => `<tr>
      <td>${item.id}</td><td>${escapeHtml(item.clientName)}</td><td>${item.usageDate}</td>
      <td>${formatBytes(item.uploadBytes)}</td><td>${formatBytes(item.downloadBytes)}</td><td>${escapeHtml(item.updatedAt)}</td></tr>`).join('');
  } catch (error) { notice(error.message, true); }
}
async function createClient(event) {
  event.preventDefault();
  try {
    const result = await api('/clients', {method:'POST', body:JSON.stringify({
      clientName: document.querySelector('#clientName').value,
      password: document.querySelector('#password').value || null,
      connectionRateLimitPerMinute: Number(document.querySelector('#rateLimit').value), enabled:true
    })});
    notice(`客户端已创建。请立即保存密码：${result.password}`);
    event.target.reset(); document.querySelector('#rateLimit').value = 30; await loadAll();
  } catch (error) { notice(error.message, true); }
}
async function editClient(id) {
  const client = clientCache.get(id); if (!client) return;
  const name = prompt('客户端名称', client.clientName); if (name === null) return;
  const password = prompt('新密码（留空表示不修改）', ''); if (password === null) return;
  const rateLimit = prompt('每分钟允许的控制连接次数，0 表示不限', client.connectionRateLimitPerMinute); if (rateLimit === null) return;
  const enabled = confirm('点击“确定”启用客户端；点击“取消”停用客户端。');
  try {
    const result = await api(`/clients/${client.id}`, {method:'PUT', body:JSON.stringify({clientName:name,password:password || null,enabled,connectionRateLimitPerMinute:Number(rateLimit)})});
    notice(result.password ? `客户端已更新。请立即保存新密码：${result.password}` : '客户端已更新。'); await loadAll();
  } catch (error) { notice(error.message, true); }
}
async function deleteClient(id) {
  if (!confirm('确定删除该客户端？历史连接和流量记录会保留。')) return;
  try { await api(`/clients/${id}`, {method:'DELETE'}); notice('客户端已删除。'); await loadAll(); }
  catch (error) { notice(error.message, true); }
}
async function createTunnel(event) {
  event.preventDefault();
  try {
    const clientId = document.querySelector('#tunnelClientId').value;
    await api(`/clients/${clientId}/tunnels`, {method:'POST', body:JSON.stringify({
      listenPort: Number(document.querySelector('#listenPort').value),
      targetAddress: document.querySelector('#targetAddress').value,
      targetPort: Number(document.querySelector('#targetPort').value), enabled:true
    })});
    notice('端口映射已新增。'); event.target.reset(); await loadAll();
  } catch (error) { notice(error.message, true); }
}
async function deleteTunnel(id) {
  if (!confirm('确定删除该端口映射？')) return;
  try { await api(`/tunnels/${id}`, {method:'DELETE'}); notice('端口映射已删除。'); await loadAll(); }
  catch (error) { notice(error.message, true); }
}
async function pushNatControl(id) {
  try { const result = await api(`/clients/${id}/nat-control`, {method:'POST'}); notice(`已向客户端下发 ${result.pushed} 条映射。`); }
  catch (error) { notice(error.message, true); }
}
async function initializeDatabase() {
  try { const result = await api('/database/initialize', {method:'POST'}); notice(`数据库初始化完成：${result.dialect}，客户端 ${result.clients} 个。`); await loadAll(); }
  catch (error) { notice(error.message, true); }
}

// --- OIDC (Authorization Code + PKCE) ---
let oidcConfig = null;
const b64url = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const randomToken = () => { const bytes = new Uint8Array(32); crypto.getRandomValues(bytes); return b64url(bytes); };
async function sha256b64url(text) {
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return b64url(new Uint8Array(digest));
}
function cleanUrl() { history.replaceState({}, document.title, location.pathname); }
function tokenValid() {
  if (!sessionStorage.getItem('access_token')) return false;
  const expiry = Number(sessionStorage.getItem('token_expiry') || 0);
  return !expiry || Date.now() < expiry - 5000;
}
function showApp() {
  document.querySelector('#login').hidden = true;
  document.querySelector('#appHeader').hidden = false;
  document.querySelector('#appMain').hidden = false;
}
function showLogin(message) {
  document.querySelector('#appHeader').hidden = true;
  document.querySelector('#appMain').hidden = true;
  document.querySelector('#login').hidden = false;
  const passwordEnabled = !!(oidcConfig && oidcConfig.passwordLoginEnabled);
  const oidcEnabled = !!(oidcConfig && oidcConfig.configured);
  document.querySelector('#pwForm').hidden = !passwordEnabled;
  document.querySelector('#loginButton').hidden = !oidcEnabled;
  document.querySelector('#loginDivider').hidden = !(passwordEnabled && oidcEnabled);
  const hint = document.querySelector('#loginHint');
  if (message) hint.textContent = message;
  else if (!passwordEnabled && !oidcEnabled) hint.textContent = '未配置任何登录方式：请设置用户名/密码或 OIDC';
  else hint.textContent = '请登录';
}
async function passwordLogin(event) {
  event.preventDefault();
  try {
    const response = await fetch('/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: document.querySelector('#pwUser').value, password: document.querySelector('#pwPass').value })
    });
    const data = await safeJson(response);
    if (!response.ok || !data.accessToken) { showLogin(data.error || '登录失败'); return; }
    sessionStorage.setItem('access_token', data.accessToken);
    if (data.expiresIn) sessionStorage.setItem('token_expiry', String(Date.now() + data.expiresIn * 1000));
    showApp();
    await loadAll();
  } catch (error) { showLogin('登录失败：' + error.message); }
}
function handleUnauthorized() {
  sessionStorage.removeItem('access_token');
  sessionStorage.removeItem('token_expiry');
  showLogin('登录已过期，请重新登录');
}
async function login() {
  if (!oidcConfig || !oidcConfig.configured) return;
  const verifier = randomToken();
  const state = randomToken();
  sessionStorage.setItem('pkce_verifier', verifier);
  sessionStorage.setItem('oidc_state', state);
  const challenge = await sha256b64url(verifier);
  const url = new URL(oidcConfig.authorizationEndpoint);
  url.searchParams.set('response_type', 'code');
  url.searchParams.set('client_id', oidcConfig.clientId);
  url.searchParams.set('redirect_uri', oidcConfig.redirectUri);
  url.searchParams.set('scope', oidcConfig.scope);
  url.searchParams.set('code_challenge', challenge);
  url.searchParams.set('code_challenge_method', 'S256');
  url.searchParams.set('state', state);
  location.assign(url.toString());
}
function logout() {
  sessionStorage.removeItem('access_token');
  sessionStorage.removeItem('token_expiry');
  if (oidcConfig && oidcConfig.endSessionEndpoint) { location.assign(oidcConfig.endSessionEndpoint); }
  else { showLogin('已退出登录'); }
}
async function completeLoginFromRedirect() {
  const params = new URLSearchParams(location.search);
  if (params.has('error')) { cleanUrl(); showLogin(params.get('error_description') || params.get('error')); return false; }
  if (!params.has('code')) return false;
  const expectedState = sessionStorage.getItem('oidc_state');
  if (!expectedState || params.get('state') !== expectedState) { cleanUrl(); showLogin('登录状态校验失败，请重试'); return false; }
  try {
    const response = await fetch('/oidc/token', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: params.get('code'), codeVerifier: sessionStorage.getItem('pkce_verifier') })
    });
    const data = await safeJson(response);
    if (!response.ok || !data.accessToken) { cleanUrl(); showLogin(data.error_description || data.error || '令牌交换失败'); return false; }
    sessionStorage.setItem('access_token', data.accessToken);
    if (data.expiresIn) sessionStorage.setItem('token_expiry', String(Date.now() + data.expiresIn * 1000));
    sessionStorage.removeItem('pkce_verifier');
    sessionStorage.removeItem('oidc_state');
    cleanUrl();
    return true;
  } catch (error) { cleanUrl(); showLogin('令牌交换失败：' + error.message); return false; }
}
async function init() {
  try { oidcConfig = await fetch('/oidc-config').then(response => response.json()); } catch { oidcConfig = null; }
  const justLoggedIn = await completeLoginFromRedirect();
  if (justLoggedIn || tokenValid()) { showApp(); await loadAll(); }
  else { showLogin(); }
}
init();
</script>
</body>
</html>
