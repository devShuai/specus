server:
  port: 8088

spring:
  datasource:
    url: ${TUNNEL_DB_URL:jdbc:sqlite:./shuai-tunnel.db}
    driver-class-name: ${TUNNEL_DB_DRIVER:org.sqlite.JDBC}
    username: ${TUNNEL_DB_USERNAME:}
    password: ${TUNNEL_DB_PASSWORD:}
    hikari:
      # Default 1 keeps the single-writer SQLite default safe. Raise it (e.g. 16-32) for MySQL/PostgreSQL.
      maximum-pool-size: ${TUNNEL_DB_POOL_SIZE:1}
  jpa:
    database-platform: ${TUNNEL_DB_DIALECT:org.hibernate.community.dialect.SQLiteDialect}
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      # Batch the traffic-flush updates and the retention bulk deletes.
      hibernate.jdbc.batch_size: ${TUNNEL_DB_BATCH_SIZE:50}
      hibernate.order_inserts: true
      hibernate.order_updates: true
  task:
    scheduling:
      # S1.4: flushHttp/flushTcp are separate @Scheduled methods; the default pool size 1
      # would serialize them. 2 lets the HTTP and TCP flush paths run concurrently so a
      # slow TCP flush can no longer block HTTP persistence (and vice versa).
      pool:
        size: ${TUNNEL_SCHEDULING_POOL_SIZE:2}
  elasticsearch:
    uris: ${TUNNEL_ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${TUNNEL_ELASTICSEARCH_USERNAME:}
    password: ${TUNNEL_ELASTICSEARCH_PASSWORD:}
    api-key: ${TUNNEL_ELASTICSEARCH_API_KEY:}
  data:
    elasticsearch:
      repositories:
        enabled: false

tunnel:
  database:
    seed-demo-client: ${TUNNEL_DB_SEED_DEMO_CLIENT:true}
  netty:
    port: ${TUNNEL_NETTY_PORT:7010}
    boss-threads: ${TUNNEL_NETTY_BOSS_THREADS:1}
    worker-threads: ${TUNNEL_NETTY_WORKER_THREADS:0}
    remote-boss-threads: ${TUNNEL_NETTY_REMOTE_BOSS_THREADS:1}
    remote-worker-threads: ${TUNNEL_NETTY_REMOTE_WORKER_THREADS:0}
    so-backlog: ${TUNNEL_NETTY_SO_BACKLOG:8192}
    reuse-address: ${TUNNEL_NETTY_REUSE_ADDRESS:true}
    keep-alive: ${TUNNEL_NETTY_KEEP_ALIVE:true}
    tcp-no-delay: ${TUNNEL_NETTY_TCP_NO_DELAY:true}
    write-buffer-low-water-mark: ${TUNNEL_NETTY_WRITE_BUFFER_LOW_WATER_MARK:32768}
    write-buffer-high-water-mark: ${TUNNEL_NETTY_WRITE_BUFFER_HIGH_WATER_MARK:65536}
    max-frame-size: ${TUNNEL_NETTY_MAX_FRAME_SIZE:33554432}
    max-external-connections: ${TUNNEL_NETTY_MAX_EXTERNAL_CONNECTIONS:10000}
    max-external-connections-per-client: ${TUNNEL_NETTY_MAX_EXTERNAL_CONNECTIONS_PER_CLIENT:10000}
    max-external-connections-per-port: ${TUNNEL_NETTY_MAX_EXTERNAL_CONNECTIONS_PER_PORT:10000}
  public-address: ${TUNNEL_PUBLIC_ADDRESS:}
  peer-mesh:
    enabled: ${TUNNEL_PEER_MESH_ENABLED:false}
    cidr: ${TUNNEL_PEER_MESH_CIDR:100.96.0.0/11}
    public-address: ${TUNNEL_PEER_MESH_PUBLIC_ADDRESS:}
    stun-turn-port: ${TUNNEL_PEER_MESH_STUN_TURN_PORT:3478}
    standalone-stun-address: ${TUNNEL_PEER_MESH_STANDALONE_STUN_ADDRESS:}
    standalone-stun-port: ${TUNNEL_PEER_MESH_STANDALONE_STUN_PORT:3478}
    standalone-stun-alternate-address: ${TUNNEL_PEER_MESH_STANDALONE_STUN_ALTERNATE_ADDRESS:}
    standalone-stun-alternate-port: ${TUNNEL_PEER_MESH_STANDALONE_STUN_ALTERNATE_PORT:0}
    nat-probe-alternate-port: ${TUNNEL_PEER_MESH_NAT_PROBE_ALTERNATE_PORT:3479}
    stun-primary-bind-address: ${TUNNEL_PEER_MESH_STUN_PRIMARY_BIND_ADDRESS:}
    stun-alternate-bind-address: ${TUNNEL_PEER_MESH_STUN_ALTERNATE_BIND_ADDRESS:}
    stun-alternate-public-address: ${TUNNEL_PEER_MESH_STUN_ALTERNATE_PUBLIC_ADDRESS:}
    stun-behavior-strict: ${TUNNEL_PEER_MESH_STUN_BEHAVIOR_STRICT:false}
    public-stun-servers: ${TUNNEL_PEER_MESH_PUBLIC_STUN_SERVERS:}
    session-ttl-seconds: ${TUNNEL_PEER_MESH_SESSION_TTL_SECONDS:3600}
    allocation-ttl-seconds: ${TUNNEL_PEER_MESH_ALLOCATION_TTL_SECONDS:300}
    relay-min-port: ${TUNNEL_PEER_MESH_RELAY_MIN_PORT:49152}
    relay-max-port: ${TUNNEL_PEER_MESH_RELAY_MAX_PORT:65535}
    relay-worker-threads: ${TUNNEL_PEER_MESH_RELAY_WORKER_THREADS:0}
    relay-worker-queue-capacity: ${TUNNEL_PEER_MESH_RELAY_WORKER_QUEUE_CAPACITY:10000}
    relay-traffic-flush-interval-ms: ${TUNNEL_PEER_MESH_RELAY_TRAFFIC_FLUSH_INTERVAL_MS:5000}
    turn-auth-required: ${TUNNEL_PEER_MESH_TURN_AUTH_REQUIRED:true}
    turn-realm: ${TUNNEL_PEER_MESH_TURN_REALM:shuai-tunnel}
    turn-shared-secret: ${TUNNEL_PEER_MESH_TURN_SHARED_SECRET:}
    turn-credential-ttl-seconds: ${TUNNEL_PEER_MESH_TURN_CREDENTIAL_TTL_SECONDS:3600}
  object-storage:
    # disabled | aliyun-oss. Attachments use server-generated short-lived presigned URLs;
    # clients upload/download directly to the private bucket.
    provider: ${TUNNEL_OBJECT_STORAGE_PROVIDER:disabled}
    endpoint: ${TUNNEL_OBJECT_STORAGE_ENDPOINT:}
    bucket: ${TUNNEL_OBJECT_STORAGE_BUCKET:}
    access-key-id: ${TUNNEL_OBJECT_STORAGE_ACCESS_KEY_ID:}
    access-key-secret: ${TUNNEL_OBJECT_STORAGE_ACCESS_KEY_SECRET:}
    object-prefix: ${TUNNEL_OBJECT_STORAGE_PREFIX:shuai-tunnel/attachments}
    upload-url-ttl-seconds: ${TUNNEL_OBJECT_STORAGE_UPLOAD_URL_TTL_SECONDS:900}
    download-url-ttl-seconds: ${TUNNEL_OBJECT_STORAGE_DOWNLOAD_URL_TTL_SECONDS:600}
    retention-hours: ${TUNNEL_OBJECT_STORAGE_RETENTION_HOURS:72}
    max-attachment-bytes: ${TUNNEL_OBJECT_STORAGE_MAX_ATTACHMENT_BYTES:536870912}
    expiration-scan-interval-ms: ${TUNNEL_OBJECT_STORAGE_EXPIRATION_SCAN_INTERVAL_MS:3600000}
  public-transfer:
    # 免登录文件互传的滥用防护。presign-upload 无鉴权,按来源 IP 固定窗口限流,
    # 并对单房间(按 roomToken 哈希)的 PENDING 附件数设上限。进程内计数,多实例部署时按实例数放大。
    presign-rate-limit-per-ip: ${TUNNEL_PUBLIC_TRANSFER_PRESIGN_RATE_LIMIT_PER_IP:30}
    presign-rate-limit-window-seconds: ${TUNNEL_PUBLIC_TRANSFER_PRESIGN_RATE_LIMIT_WINDOW_SECONDS:300}
    max-pending-uploads-per-room: ${TUNNEL_PUBLIC_TRANSFER_MAX_PENDING_UPLOADS_PER_ROOM:50}
    max-discovery-peers-per-room: ${TUNNEL_PUBLIC_TRANSFER_MAX_DISCOVERY_PEERS_PER_ROOM:32}
    discovery-message-rate-limit-per-connection: ${TUNNEL_PUBLIC_TRANSFER_DISCOVERY_MESSAGE_RATE_LIMIT_PER_CONNECTION:360}
    discovery-message-rate-limit-window-seconds: ${TUNNEL_PUBLIC_TRANSFER_DISCOVERY_MESSAGE_RATE_LIMIT_WINDOW_SECONDS:60}
  client-auth:
    default-max-online-instances: ${TUNNEL_CLIENT_AUTH_DEFAULT_MAX_ONLINE_INSTANCES:2}
    per-machine-user-max-instances: ${TUNNEL_CLIENT_AUTH_PER_MACHINE_USER_MAX_INSTANCES:1}
    token-ttl-seconds: ${TUNNEL_CLIENT_AUTH_TOKEN_TTL_SECONDS:28800}
  auth:
    # Local username/password login for the management UI (alternative to OIDC). A successful login
    # mints a short-lived HS256 JWT the admin API accepts alongside the OIDC tokens. Change the
    # default admin/admin before exposing the server. Set password to blank to disable this login.
    password-login-enabled: ${TUNNEL_AUTH_PASSWORD_LOGIN_ENABLED:true}
    username: ${TUNNEL_AUTH_USERNAME:admin}
    password: ${TUNNEL_AUTH_PASSWORD:admin}
    tenant-id: ${TUNNEL_AUTH_TENANT_ID:default}
    jwt-secret: ${TUNNEL_AUTH_JWT_SECRET:}
    token-ttl-seconds: ${TUNNEL_AUTH_TOKEN_TTL_SECONDS:28800}
  oidc:
    # The management UI logs in via OIDC (Authorization Code + PKCE) and the admin API validates
    # the resulting JWT. Defaults target the project gateway; set client-id (and register the
    # redirect-uri at the provider) per deployment. Leave client-secret blank for a public PKCE client.
    issuer: ${TUNNEL_OIDC_ISSUER:https://gateway.toys.theshuai.com/auth}
    jwk-set-uri: ${TUNNEL_OIDC_JWK_SET_URI:https://gateway.toys.theshuai.com/auth/oauth2/jwks}
    authorization-endpoint: ${TUNNEL_OIDC_AUTHORIZATION_ENDPOINT:https://gateway.toys.theshuai.com/auth/oauth2/authorize}
    token-endpoint: ${TUNNEL_OIDC_TOKEN_ENDPOINT:https://gateway.toys.theshuai.com/auth/oauth2/token}
    end-session-endpoint: ${TUNNEL_OIDC_END_SESSION_ENDPOINT:https://gateway.toys.theshuai.com/auth/connect/logout}
    client-id: ${TUNNEL_OIDC_CLIENT_ID:}
    client-secret: ${TUNNEL_OIDC_CLIENT_SECRET:}
    redirect-uri: ${TUNNEL_OIDC_REDIRECT_URI:http://127.0.0.1:8088/}
    scope: ${TUNNEL_OIDC_SCOPE:openid}
    audience: ${TUNNEL_OIDC_AUDIENCE:}
    tenant-claim: ${TUNNEL_OIDC_TENANT_CLAIM:tenant_id}
  traffic:
    flush-interval-ms: ${TUNNEL_TRAFFIC_FLUSH_INTERVAL_MS:5000}
    capture-detail-enabled: ${TUNNEL_TRAFFIC_CAPTURE_DETAIL_ENABLED:false}
    # TCP keeps a short preview for list rendering and stores the full payload separately.
    capture-preview-bytes: ${TUNNEL_TRAFFIC_CAPTURE_PREVIEW_BYTES:256}
    capture-header-chars: ${TUNNEL_TRAFFIC_CAPTURE_HEADER_CHARS:8192}
    capture-decode-max-bytes: ${TUNNEL_TRAFFIC_CAPTURE_DECODE_MAX_BYTES:1048576}
    capture-max-pending: ${TUNNEL_TRAFFIC_CAPTURE_MAX_PENDING:20000}
    capture-flush-batch-size: ${TUNNEL_TRAFFIC_CAPTURE_FLUSH_BATCH_SIZE:1000}
    capture-flush-interval-ms: ${TUNNEL_TRAFFIC_CAPTURE_FLUSH_INTERVAL_MS:2000}
    # S4.2 采样率 0.0-1.0；每个方向的首帧始终捕获，其余帧按此比例采样，默认全量
    capture-sample-rate: ${TUNNEL_TRAFFIC_CAPTURE_SAMPLE_RATE:1.0}
  elasticsearch:
    # When blank, HTTP exchange detail uses the database. When set, HTTP exchange detail writes
    # and reads through Spring Data Elasticsearch instead.
    uris: ${TUNNEL_ELASTICSEARCH_URIS:}
    username: ${TUNNEL_ELASTICSEARCH_USERNAME:}
    password: ${TUNNEL_ELASTICSEARCH_PASSWORD:}
    api-key: ${TUNNEL_ELASTICSEARCH_API_KEY:}
    index: ${TUNNEL_ELASTICSEARCH_HTTP_INDEX:shuai-tunnel-http-traffic}
    tcp-index: ${TUNNEL_ELASTICSEARCH_TCP_INDEX:shuai-tunnel-tcp-traffic}
    http-max-store-size: ${TUNNEL_ELASTICSEARCH_HTTP_MAX_STORE_SIZE:100GB}
    tcp-max-store-size: ${TUNNEL_ELASTICSEARCH_TCP_MAX_STORE_SIZE:10GB}
  connection-record:
    # Rolling days of raw login detail to keep. Older detail is rolled up into per-natural-month
    # totals (kept indefinitely) and then deleted. 0 disables archiving.
    detail-retention-days: ${TUNNEL_CONNECTION_DETAIL_RETENTION_DAYS:60}
    archive-interval-ms: ${TUNNEL_CONNECTION_ARCHIVE_INTERVAL_MS:3600000}
  http:
    timeout-ms: ${TUNNEL_HTTP_TIMEOUT_MS:30000}
    max-request-body-size: ${TUNNEL_HTTP_MAX_REQUEST_BODY_SIZE:16777216}
    route-cache-ttl-ms: ${TUNNEL_HTTP_ROUTE_CACHE_TTL_MS:2000}
  login:
    executor:
      core-size: ${TUNNEL_LOGIN_EXECUTOR_CORE:8}
      max-size: ${TUNNEL_LOGIN_EXECUTOR_MAX:32}
      queue-capacity: ${TUNNEL_LOGIN_EXECUTOR_QUEUE:20000}
  tls:
    # disabled: control channel is plain TCP (legacy)
    # file: load keystore/truststore from disk (production)
    # self-signed: generate a transient self-signed cert (dev/test)
    mode: ${TUNNEL_TLS_MODE:disabled}
    keystore: ${TUNNEL_TLS_KEYSTORE:}
    keystore-password: ${TUNNEL_TLS_KEYSTORE_PASSWORD:}
    key-password: ${TUNNEL_TLS_KEY_PASSWORD:}
