plugins {
    id "com.android.application"
    id "org.cyclonedx.bom"
}

// The SBOM the dependency audit scans. Scoped to the classpath that actually ships: by default the
// plugin reports every configuration, which drags in the Android Gradle Plugin's own build-time
// dependencies. Those never reach the APK, and holding CI red over versions we do not control
// would train people to ignore the gate.
cyclonedxBom {
    includeConfigs = ["releaseRuntimeClasspath"]
    outputFormat = "json"
    outputName = "android-sbom"
}

def releaseVersion = providers.gradleProperty("releaseVersion")
        .orElse(providers.environmentVariable("RELEASE_VERSION"))
        .orElse("0.1.0")
        .get()
        .replaceFirst(/^v/, "")
def releaseVersionCode = providers.gradleProperty("releaseVersionCode")
        .orElse(providers.environmentVariable("RELEASE_VERSION_CODE"))
        .orElse("1")
        .get()
        .toInteger()
def releaseKeystore = providers.environmentVariable("SPECUS_ANDROID_KEYSTORE").orNull
def releaseKeystorePassword = providers.environmentVariable("SPECUS_ANDROID_KEYSTORE_PASSWORD").orNull
def releaseKeyAlias = providers.environmentVariable("SPECUS_ANDROID_KEY_ALIAS").orNull
def releaseKeyPassword = providers.environmentVariable("SPECUS_ANDROID_KEY_PASSWORD").orNull

android {
    namespace "com.theshuai.specus.android"
    compileSdk 35

    defaultConfig {
        applicationId "com.theshuai.specus.android"
        minSdk 26
        targetSdk 35
        versionCode releaseVersionCode
        versionName releaseVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (releaseKeystore && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword) {
            release {
                storeFile file(releaseKeystore)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigs.findByName("release") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        // The handshake reports BuildConfig.VERSION_NAME, so the generated class must exist
        // (AGP 8 no longer emits it by default).
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            // Netty publishes these module-level metadata files in every split jar.
            // They are diagnostic-only and cannot be merged into one Android APK.
            excludes += [
                    "META-INF/INDEX.LIST",
                    "META-INF/io.netty.versions.properties"
            ]
        }
    }
}

dependencies {
    implementation "io.netty:netty-codec-http:4.1.137.Final"
    implementation "io.netty:netty-handler:4.1.137.Final"
    testImplementation "junit:junit:4.13.2"
    // Android's org.json classes are stubs in local JVM tests. Use the matching
    // standalone implementation so protocol JSON is exercised for real.
    testImplementation "org.json:json:20250517"
    // On-device coverage for behaviour the JVM cannot reach: real Android service lifecycle.
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test:rules:1.6.1"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
}
