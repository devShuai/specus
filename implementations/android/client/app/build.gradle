plugins {
    id "com.android.application"
}

android {
    namespace "com.theshuai.specus.android"
    compileSdk 35

    defaultConfig {
        applicationId "com.theshuai.specus.android"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    buildFeatures {
        // The handshake reports BuildConfig.VERSION_NAME, so the generated class must exist
        // (AGP 8 no longer emits it by default).
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            // Netty publishes these module-level metadata files in every split jar.
            // They are diagnostic-only and cannot be merged into one Android APK.
            excludes += [
                    "META-INF/INDEX.LIST",
                    "META-INF/io.netty.versions.properties"
            ]
        }
    }
}

dependencies {
    implementation "io.netty:netty-codec-http:4.1.110.Final"
    implementation "io.netty:netty-handler:4.1.110.Final"
    testImplementation "junit:junit:4.13.2"
    // Android's org.json classes are stubs in local JVM tests. Use the matching
    // standalone implementation so protocol JSON is exercised for real.
    testImplementation "org.json:json:20250517"
}
