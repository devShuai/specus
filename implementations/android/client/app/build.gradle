plugins {
    id "com.android.application"
}

android {
    namespace "com.theshuai.specus.android"
    compileSdk 35

    defaultConfig {
        applicationId "com.theshuai.specus.android"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    testImplementation "junit:junit:4.13.2"
    // Android's org.json classes are stubs in local JVM tests. Use the matching
    // standalone implementation so protocol JSON is exercised for real.
    testImplementation "org.json:json:20250517"
}
