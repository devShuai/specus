# OpenResty frontend acceleration for specus / specus.devshuai.com.
#
# The file is included under nginx.conf's `http {}` context:
#   /usr/local/openresty/nginx/conf/conf.d/specus.devshuai.com.conf
#
# Static root should contain apps/admin-web/dist after:
#   cd apps/admin-web && npm run build:openresty

map $http_upgrade $specus_connection_upgrade {
    default upgrade;
    ''      close;
}

map $uri $specus_cache_control {
    default "no-cache, no-store, must-revalidate";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/(favicon\.ico|favicon\.svg|logo\.svg|robots\.txt|sitemap\.xml|gtag-init\.js)$ "public, max-age=3600";
}

upstream specus_server {
    server 127.0.0.1:8088;
    keepalive 64;
}

server {
    listen 80;
    server_name specus.devshuai.com;
    charset utf-8;
    root /opt/specus/admin-web;
    index index.html;
    access_log logs/specus.devshuai.com.log docker;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    keepalive_requests 1000;
    client_max_body_size 32m;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.ms-fontobject
        application/wasm
        application/x-javascript
        application/xml
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://challenges.cloudflare.com 'sha256-18LyML/37soz5WqRSkGT3SWKUgOA6TN/LeY+x9y/X/Q=' 'sha256-sTRDNOsQlwtkSpNEy6tDUxqi0/WSUG1VrhzE550hzwo='; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://www.google-analytics.com https://*.googletagmanager.com https://*.aliyuncs.com; media-src 'self' blob: data: https://*.aliyuncs.com; object-src 'self' blob:; frame-src 'self' blob: https://challenges.cloudflare.com; font-src 'self' data:; connect-src 'self' ws: wss: https://www.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.aliyuncs.com; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header Cache-Control $specus_cache_control always;

    location = /index.html {
        try_files /index.html =404;
    }

    location = / {
        try_files /index.html =404;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
    }

    location ~* ^/(favicon\.ico|favicon\.svg|logo\.svg|robots\.txt|sitemap\.xml|gtag-init\.js)$ {
        try_files $uri =404;
        access_log off;
    }

    location /ws/ {
        proxy_pass http://specus_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $specus_connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # HTTP specus responses are third-party applications, not admin-web pages.
    # Preserve the upstream application's browser policy instead of inheriting
    # the portal CSP/permissions/cache headers from this server block.
    location ^~ /http/ {
        proxy_pass http://specus_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 0;

        # A location-level add_header disables inheritance of all portal
        # add_header directives. Re-add only the CSP received from the specus.
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy $upstream_http_content_security_policy always;
    }

    location ~ ^/(api|auth|oidc|oidc-config|actuator|health|\.well-known)(/|$) {
        proxy_pass http://specus_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 0;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
    }

    location /ngx_status {
        stub_status on;
        access_log on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name specus.devshuai.com;
    charset utf-8;
    root /opt/specus/admin-web;
    index index.html;
    access_log logs/specus.devshuai.com.log docker;

    ssl_certificate_key /usr/local/openresty/nginx/certs/devshuai.com.key.pem;
    ssl_certificate /usr/local/openresty/nginx/certs/devshuai.com.cert.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers TLS13-AES-256-GCM-SHA384:TLS13-CHACHA20-POLY1305-SHA256:TLS13-AES-128-GCM-SHA256:TLS13-AES-128-CCM-8-SHA256:TLS13-AES-128-CCM-SHA256:EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+ECDSA+AES128:EECDH+aRSA+AES128:RSA+AES128:EECDH+ECDSA+AES256:EECDH+aRSA+AES256:RSA+AES256:!MD5;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 119.29.29.29 8.8.8.8 valid=300s;
    resolver_timeout 10s;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    keepalive_requests 1000;
    client_max_body_size 32m;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.ms-fontobject
        application/wasm
        application/x-javascript
        application/xml
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://challenges.cloudflare.com 'sha256-18LyML/37soz5WqRSkGT3SWKUgOA6TN/LeY+x9y/X/Q=' 'sha256-sTRDNOsQlwtkSpNEy6tDUxqi0/WSUG1VrhzE550hzwo='; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://www.google-analytics.com https://*.googletagmanager.com https://*.aliyuncs.com; media-src 'self' blob: data: https://*.aliyuncs.com; object-src 'self' blob:; frame-src 'self' blob: https://challenges.cloudflare.com; font-src 'self' data:; connect-src 'self' ws: wss: https://www.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://*.aliyuncs.com; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header Cache-Control $specus_cache_control always;

    location = /index.html {
        try_files /index.html =404;
    }

    location = / {
        try_files /index.html =404;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
    }

    location ~* ^/(favicon\.ico|favicon\.svg|logo\.svg|robots\.txt|sitemap\.xml|gtag-init\.js)$ {
        try_files $uri =404;
        access_log off;
    }

    location /ws/ {
        proxy_pass http://specus_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $specus_connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # HTTP specus responses are third-party applications, not admin-web pages.
    # Preserve the upstream application's browser policy instead of inheriting
    # the portal CSP/permissions/cache headers from this server block.
    location ^~ /http/ {
        proxy_pass http://specus_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 0;

        # Keep HSTS on the public HTTPS origin, then pass through the specus's
        # own CSP and all other upstream response headers unchanged.
        proxy_hide_header Content-Security-Policy;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy $upstream_http_content_security_policy always;
    }

    location ~ ^/(api|auth|oidc|oidc-config|actuator|health|\.well-known)(/|$) {
        proxy_pass http://specus_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 0;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
    }

    location /ngx_status {
        stub_status on;
        access_log on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
