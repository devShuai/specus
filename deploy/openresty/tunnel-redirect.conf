# Legacy public hostname redirect after the Specus rename.
# Keep $request_uri so paths and query strings continue to work.

server {
    listen 80;
    server_name tunnel.devshuai.com;
    access_log logs/tunnel.devshuai.com.redirect.log docker;

    server_tokens off;
    return 308 https://specus.devshuai.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name tunnel.devshuai.com;
    access_log logs/tunnel.devshuai.com.redirect.log docker;

    ssl_certificate_key /usr/local/openresty/nginx/certs/devshuai.com.key.pem;
    ssl_certificate /usr/local/openresty/nginx/certs/devshuai.com.cert.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers TLS13-AES-256-GCM-SHA384:TLS13-CHACHA20-POLY1305-SHA256:TLS13-AES-128-GCM-SHA256:TLS13-AES-128-CCM-8-SHA256:TLS13-AES-128-CCM-SHA256:EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+ECDSA+AES128:EECDH+aRSA+AES128:RSA+AES128:EECDH+ECDSA+AES256:EECDH+aRSA+AES256:RSA+AES256:!MD5;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    return 308 https://specus.devshuai.com$request_uri;
}
